packages:
  - packages/*
  - demo
  - e2e/fixtures/*

catalogMode: prefer
cleanupUnusedCatalogs: true

catalog:
  '@types/node': ^22.20.1
  typescript: ^7.0.2
  # The next three are packages vite-plus depends on directly, pinned exactly at
  # the versions it bundles. They are not independently bumpable: a stale pin
  # here puts a second copy of one of them in node_modules, and the two copies
  # never see each other. Move them with vite-plus, which is what `vp migrate`
  # does — bumping vite-plus by hand does not. Both halves have already cost a
  # release: vitest left `vp test` and a bare `vitest` on two copies of
  # @vitest/runner (unit tests dead, browser tests hung silently), and `vite` —
  # spelled as an alias onto @voidzero-dev/vite-plus-core, the package vite-plus
  # is itself built on — left node_modules/vite one patch behind what vite-plus
  # ran internally, which made `Plugin` two different types and failed
  # `vp check` on packages/client/vite.config.ts (#46).
  vite: npm:@voidzero-dev/vite-plus-core@0.2.7
  vitest: 4.1.10
  '@vitest/browser-playwright': 4.1.10
  vite-plus: 0.2.7
  react: ^19.2.8
  react-dom: ^19.2.8
  react-aria-components: ^1.20.0
  '@inlang/paraglide-js': ^2.23.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^6.0.5
  prosemirror-model: ^1.25.11
  prosemirror-state: ^1.4.4
  prosemirror-view: ^1.42.2
  prosemirror-transform: ^1.12.0
  prosemirror-commands: ^1.7.1
  prosemirror-history: ^1.5.0
  prosemirror-keymap: ^1.2.3
  ofetch: ^1.5.1
  valibot: ^1.4.2
  pdfjs-dist: ^6.2.108
  '@napi-rs/canvas': ^1.0.3
  chokidar: ^5.0.0
  vitest-browser-react: ^2.2.0
  playwright: ^1.62.1
  '@playwright/test': ^1.62.1
  citty: ^0.2.2
  vitefu: ^1.1.3
  prosemirror-schema-list: ^1.5.1
  eta: ^4.6.0
  knip: ^6.31.0
  '@tailwindcss/vite': ^4.3.3
  tailwindcss: ^4.3.3
  '@phosphor-icons/react': ^2.1.10
  clsx: ^2.1.1
  jotai: ^2.20.2
  react-error-boundary: ^6.1.2
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
  chokidar: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true

engineStrict: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - tinyexec@1.2.2
  - undici-types@6.21.0
