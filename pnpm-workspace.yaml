packages:
  - packages/*
  - demo
  - e2e/fixtures/*

catalogMode: prefer
cleanupUnusedCatalogs: true

catalog:
  '@types/node': ^22.20.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.5
  # Pinned exactly at the version vite-plus bundles, so that `vp test` and a bare
  # `vitest` cannot resolve two copies of @vitest/runner (which killed the unit
  # tests and hung the browser ones silently). Never bump this independently of
  # vite-plus — let `vp migrate` move them in lockstep. Same for
  # @vitest/browser-playwright below.
  vitest: 4.1.10
  vite-plus: 0.2.5
  react: ^19.2.8
  react-dom: ^19.2.8
  react-aria-components: ^1.19.0
  '@inlang/paraglide-js': ^2.22.0
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^6.0.4
  prosemirror-model: ^1.25.11
  prosemirror-state: ^1.4.4
  prosemirror-view: ^1.42.1
  prosemirror-transform: ^1.12.0
  prosemirror-commands: ^1.7.1
  prosemirror-history: ^1.5.0
  prosemirror-keymap: ^1.2.3
  ofetch: ^1.5.1
  valibot: ^1.4.2
  pdfjs-dist: ^6.1.200
  '@napi-rs/canvas': ^1.0.2
  chokidar: ^5.0.0
  '@vitest/browser-playwright': 4.1.10
  vitest-browser-react: ^2.2.0
  playwright: ^1.61.1
  '@playwright/test': ^1.61.1
  citty: ^0.2.2
  vitefu: ^1.1.3
  prosemirror-schema-list: ^1.5.1
  eta: ^4.6.0
  knip: ^6.27.0
  '@tailwindcss/vite': ^4.3.3
  tailwindcss: ^4.3.3
  '@phosphor-icons/react': ^2.1.10
  clsx: ^2.1.1
  jotai: ^2.20.2
  react-error-boundary: ^6.1.2
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
  chokidar: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true

engineStrict: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - tinyexec@1.2.2
  - undici-types@6.21.0
