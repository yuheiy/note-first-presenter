# The first automated trigger this repo has had. Until now the only thing that
# ran without being asked was the `vp check --fix` commit hook (`staged` in the
# root vite.config.ts), which sees one commit's staged files and nothing else.
#
# No ADR covers this file: introducing CI is neither hard to reverse nor
# surprising. The choices that a reader might question are explained inline,
# which is where this repo puts anything that can live next to what it governs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18.0 is spelled out rather than '22' on purpose: it is the exact
        # number `engines` declares, and until this workflow existed nothing had
        # ever executed it — local development and every test layer run on 24.
        # '22' would resolve to the latest 22.x and leave the declared floor
        # unexercised, which is the same shape of hole that issue #38 fell into.
        # The floor comes from dependencies, not from the language: vite wants
        # ^20.19.0 || ^22.18.0 || >=24.11.0 and pdfjs-dist wants >=22.13.0 || >=24
        # (docs/adr/0020). vite-plus itself declares the same range as vite.
        #
        # Ubuntu only. The one platform-specific thing this repo knows about is
        # `node --watch-path`, which does not work on Linux — and that is a single
        # line of demo's dev script, touching neither the build, the tests, nor
        # the published artifact (docs/adr/0020). A matrix over OS would have
        # nothing to catch here.
        node: ['22.18.0', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node }}
          # Package-manager caching only. Vite Task's own cache
          # (node_modules/.vite/task-cache) is deliberately not restored across
          # runs: Vite+ marks that experimental and warns that short tasks lose
          # more to cache transfer than they save. Measure before adding it.
          cache: true

      - run: vp install

      # Paraglide's output is gitignored and regenerated by the client's
      # `prepare`, which pnpm only runs when installing actually does work — so a
      # restored cache can leave node_modules current and src/lib/paraglide
      # missing. `vp check` is a builtin rather than a `vp run` task, so it cannot
      # carry `vp run messages` as a prefix the way the test tasks do, and without
      # it the check dies on eleven unresolved imports. docs/adr/0016 called this
      # exact CI case out before there was a CI.
      - run: vp run messages
      - run: vp check

      # The browser unit project drives a real Chromium through Playwright
      # (packages/client/vite.config.ts). The repo's only `playwright install`
      # lives inside the `test:e2e` task, which `vp run test` reaches last — so on
      # a fresh runner the browser tests would fail long before anything installed
      # a browser. Cheap and idempotent here; `test:e2e` re-running it is a no-op.
      - run: vp exec playwright install --with-deps chromium

      - run: vp run test

  # Separate from `test` so a red check names the diagnosis. "The published form
  # is broken" and "a test failed" are different problems with different fixes,
  # and the same reasoning already split e2e into dev/static projects
  # (docs/adr/0005, 2026-07-26 addendum). It also skips the browser download,
  # which this needs nothing from.
  #
  # On the same Node matrix as `test`, and this is where the floor earns the
  # most: it is the only job that runs the CLI as an installed package, so it is
  # the only place `engines` is checked against what a published user actually
  # gets rather than against the workspace.
  verify-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node }}
          cache: true

      - run: vp install
      - run: vp run -w verify:package
